<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordly Usage Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style id="app-style">
  :root {
    color-scheme: light;
    --blue: #017CFF;
    --blue-2: #1BC3E4;
    --green-2: #48EA76;
    --gradient: linear-gradient(to right, #017CFF, #1BC3E4, #48EA76);
    --bg: #F2F2F2;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --text: #353535;
    --muted: #6B6F75;
    --line: #DFDFDF;
    --warn-bg: #FFF4DE;
    --warn-text: #8A4B00;
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --blue: #4A9EFF;
      --bg: #1C1E21;
      --surface: #25282C;
      --surface-2: #2C3035;
      --text: #ECEDEE;
      --muted: #A5A9AF;
      --line: #3A3E44;
      --warn-bg: #3A2E17;
      --warn-text: #FFCE7A;
    }
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --blue: #4A9EFF;
      --bg: #1C1E21;
      --surface: #25282C;
      --surface-2: #2C3035;
      --text: #ECEDEE;
      --muted: #A5A9AF;
      --line: #3A3E44;
      --warn-bg: #3A2E17;
      --warn-text: #FFCE7A;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
  header.top::before { content: ""; display: block; height: 4px; background: var(--gradient); }
  .top-inner { max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .wordmark { font-weight: 700; font-size: 22px; color: var(--blue); letter-spacing: -0.02em; }
  .brand-sub { color: var(--muted); font-weight: 500; }
  .customer { font-weight: 700; font-size: 15px; }
  .range { color: var(--muted); font-size: 14px; }

  main { max-width: 1280px; margin: 0 auto; padding: 24px; }

  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }

  /* Upload */
  .upload { max-width: 760px; margin: 40px auto; }
  .upload h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
  .upload p.lead { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
  .drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); padding: 40px 24px; text-align: center; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--blue); background: var(--surface-2); }
  .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .drop span { color: var(--muted); }
  .drop .btn { margin-top: 16px; }
  .file-list { list-style: none; padding: 0; margin: 20px 0; }
  .file-list li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .file-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.tx { background: rgba(1,124,255,.12); color: var(--blue); }
  .tag.usage { background: rgba(18,151,55,.14); color: #129737; }
  .tag.bad { background: var(--warn-bg); color: var(--warn-text); }
  .remove { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; }
  .upload-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 14px; }
  .tl-summary { margin: 0 0 12px; }
  .tl-scroll { overflow-x: auto; }
  .tl { min-width: 760px; }
  .tl-axis, .tl-row { display: grid; grid-template-columns: 240px 1fr; align-items: center; }
  .tl-label-head { font-size: 13px; color: var(--muted); }
  .tl-row { border-top: 1px solid var(--line); }
  .tl-label { padding: 8px 12px 8px 0; min-width: 0; }
  .tl-title { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-sub { font-size: 13px; color: var(--muted); }
  .tl-track { position: relative; height: 44px; }
  .tl-ticks { height: 28px; }
  .tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .tl-tick { position: absolute; bottom: 6px; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tl-tick.first { transform: none; }
  .tl-bar { position: absolute; top: 10px; height: 24px; min-width: 5px; border: 0; padding: 0; border-radius: 5px; background: var(--blue); }
  .tl-bar.unbilled { background: repeating-linear-gradient(135deg, var(--blue-2) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1.5px var(--blue-2); }
  .tl-bar.from-prev { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .tl-bar.to-next { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tl-bar:hover, .tl-bar.sel { outline: 2px solid var(--text); outline-offset: 1px; z-index: 2; }
  .tl-foot { display: flex; gap: 12px 24px; align-items: baseline; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .tl-legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .tl-key { display: inline-block; width: 18px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--blue); vertical-align: -1px; }
  .tl-key.unbilled { background: repeating-linear-gradient(135deg, var(--blue-2) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1.5px var(--blue-2); }
  .tl-detail { flex: 1; min-width: 240px; font-size: 14px; }
  @media (max-width: 860px) { .tl-axis, .tl-row { grid-template-columns: 150px 1fr; } }
  .event.group { border-left: 4px solid var(--blue); }
  .gmeta { color: var(--muted); font-size: 14px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  .chip { border: 1px dashed var(--blue); background: var(--surface); border-radius: 999px; padding: 6px 8px 6px 14px; display: inline-flex; gap: 10px; align-items: center; font-size: 14px; }
  .chip:hover { background: var(--surface-2); }
  .chip .plus { background: var(--blue); color: #fff; border-radius: 999px; padding: 2px 10px; font-weight: 500; font-size: 13px; }
  .pick-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .pick { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .pick:last-child { border-bottom: 0; }
  .pick:hover { background: var(--surface-2); }
  .pick input { margin-top: 4px; }
  .pick b { display: block; font-weight: 500; }
  .pick small { color: var(--muted); font-size: 13px; }
  #gSearch { background: var(--surface-2); }
  .tl-day + .tl-day { margin-top: 24px; padding-top: 20px; border-top: 2px solid var(--line); }
  .tl-day-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .tl-day-head h3 { margin: 0; font-size: 16px; }
  .tl-more { margin-top: 16px; }
  table.data tfoot td { background: var(--surface-2); }
  tr.row-sel td { background: var(--surface-2); }
  .acct-body { grid-template-columns: minmax(280px, 1fr) 2fr; align-items: start; }
  @media (max-width: 860px) { .acct-body { grid-template-columns: 1fr; } }
  .bulk-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--blue); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .bulk-bar span { font-weight: 500; margin-right: auto; }
  .btn.danger { border-color: #C0392B; color: #C0392B; }
  .btn.danger:hover { background: rgba(192,57,43,.08); }
  .pick-col { width: 36px; }
  .remove-row { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; font-size: 13px; }
  .remove-row:hover { color: #C0392B; background: rgba(192,57,43,.08); }
  .removed summary { cursor: pointer; font-weight: 500; }
  .removed-list { margin-top: 10px; max-height: 260px; overflow-y: auto; }
  .removed-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .removed-item .btn { padding: 3px 10px; font-size: 13px; }
  .unit-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .unit-toggle button { border: 0; background: none; padding: 7px 12px; font-weight: 500; color: var(--muted); }
  .unit-toggle button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .cust h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
  .cs-q { width: 100%; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
  .cs-q:focus { border-color: var(--blue); outline: none; }
  .cs-results { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; max-height: 340px; overflow-y: auto; }
  .cs-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .cs-row:hover { border-color: var(--blue); }
  .cs-row.on { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue); background: var(--surface-2); }
  .cs-kind { font-size: 12px; font-weight: 500; color: var(--blue); }
  .cs-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-selected, .saved { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .saved-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; font-size: 14px; }
  .chip-main { border: 0; background: none; padding: 6px 4px 6px 14px; }
  button.chip-main:hover { color: var(--blue); }
  .chip-x { border: 0; background: none; color: var(--muted); padding: 6px 12px 6px 6px; font-size: 16px; line-height: 1; }
  .cs-form { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin: 16px 0; }
  .cs-form .field { margin: 0; flex: 1 1 240px; }
  .cs-form label { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .cs-form .field { color: var(--text); flex-direction: column; align-items: stretch; gap: 6px; }
  .unit-toggle[hidden] { display: none; }
  .cs-save { padding-bottom: 8px; }
  @media (max-width: 600px) { .cs-row { grid-template-columns: 1fr auto; } .cs-kind { grid-column: 1 / -1; } }
  .neg { color: #C0392B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .neg { color: #FF8A7A; } }
  :root[data-theme="dark"] .neg { color: #FF8A7A; }
  .notice.info { background: rgba(1,124,255,.10); color: var(--text); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); width: min(560px, calc(100% - 32px)); padding: 24px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dlg-head h2 { margin: 0; font-size: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; margin: 16px 0; }
  .field input, .share-link input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-weight: 400; }
  .share-link { display: flex; gap: 8px; margin-top: 16px; }
  .share-link input { flex: 1; min-width: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 10px; font-weight: 500; z-index: 20; }
  .diag { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 14px; }
  .diag summary { font-weight: 700; cursor: pointer; }
  .diag .stats-table td:last-child { font-weight: 500; }
  .error { background: var(--warn-bg); color: var(--warn-text); padding: 12px 16px; border-radius: 10px; margin: 16px 0; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
  .tab { border: 0; background: none; padding: 10px 16px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }

  .notice { background: var(--warn-bg); color: var(--warn-text); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
  .notice summary { cursor: pointer; font-weight: 500; }
  .notice ul { margin: 8px 0 0; padding-left: 20px; }

  /* KPI strip: one band, divided, not separate cards */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 24px; overflow: hidden; }
  .kpi { padding: 20px 24px; border-left: 1px solid var(--line); }
  .kpi:first-child { border-left: 0; }
  .kpi .v { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .kpi:first-child .v { color: var(--blue); }

  h2.section { font-size: 17px; margin: 0 0 12px; }
  .balances { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .balance { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .balance .acct { font-weight: 700; }
  .balance .email { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .balance .left { margin-top: 8px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .balance .left small { font-size: 13px; font-weight: 500; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
  .panel h3 { margin: 0 0 14px; font-size: 15px; }
  .chart-box { position: relative; height: 280px; }
  .grid2 > .panel:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .share { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); margin-right: 8px; vertical-align: middle; overflow: hidden; }
  .share span { display: block; height: 100%; background: var(--blue); }

  /* Events */
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar label { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .filters { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .filters input[type="time"] { margin-left: 4px; }
  .filter-summary { margin: 0 0 16px; }
  select, input[type="date"], input[type="time"], input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .event { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .event:hover { border-color: var(--blue); }
  .event[aria-expanded="true"] { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .event .t { font-weight: 700; line-height: 1.3; }
  .event .stats { display: flex; gap: 16px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
  .event .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .langbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  .drill { background: var(--surface); border: 1px solid var(--blue); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .drill-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .drill-head h3 { margin: 0; flex: 1; font-size: 18px; }
  .drill-body { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: center; }
  .stats-table { width: 100%; border-collapse: collapse; }
  .stats-table td { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stats-table td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Table */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data th { background: var(--surface-2); font-weight: 500; position: sticky; top: 0; }
  table.data th button { border: 0; background: none; padding: 0; font-weight: 500; color: inherit; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data td.wrap { white-space: normal; min-width: 180px; }
  table.data tbody tr:hover { background: var(--surface-2); }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; color: var(--muted); font-size: 14px; gap: 12px; flex-wrap: wrap; }
  .pager .btn { padding: 6px 12px; }
  .pager .btn:disabled { opacity: .4; cursor: not-allowed; }
  .empty { color: var(--muted); padding: 32px; text-align: center; }

  @media (max-width: 860px) {
    .kpis { grid-template-columns: 1fr 1fr; }
    .kpi:nth-child(3) { border-left: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
    .grid2, .drill-body { grid-template-columns: 1fr; }
    main { padding: 16px; }
    .top-inner { padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== Visual system v2: Wordly brand, quiet and structured ===== */
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #F7F9FC; --line: #E2E6EC;
    --text: #353535; --muted: #66707D; --blue: #017CFF; --tint: rgba(1,124,255,.08);
    --warn-line: #FFB631; --warn-bg: #FFFFFF; --warn-text: #353535;
    --r: 8px; --r-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1520; --surface: #131E2B; --surface-2: #192636; --line: #233246;
      --text: #E6ECF2; --muted: #8FA0B3; --blue: #4AA0FF; --tint: rgba(74,160,255,.12);
      --warn-bg: #131E2B; --warn-text: #E6ECF2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1520; --surface: #131E2B; --surface-2: #192636; --line: #233246;
    --text: #E6ECF2; --muted: #8FA0B3; --blue: #4AA0FF; --tint: rgba(74,160,255,.12);
    --warn-bg: #131E2B; --warn-text: #E6ECF2;
  }
  body { font-size: 14px; }
  main { max-width: 1440px; padding: 28px 32px 48px; }

  header.top { border-bottom: 1px solid var(--line); }
  header.top::before { height: 2px; }
  .top-inner { max-width: 1440px; padding: 10px 32px; min-height: 56px; gap: 10px; }
  .wordmark { font-size: 20px; }
  .brand-sub { padding-left: 10px; border-left: 1px solid var(--line); font-size: 14px; }
  .top-inner #customer, .top-inner #range { display: none; }

}
async function detectFile(entry) {
  try {
    const rows = await readSheet(entry.file);
    const hdr = findHeader(rows);
    if (!hdr) { entry.kind = "bad"; entry.note = "Not a Transaction or Usage report"; return; }
    entry.kind = hdr.kind; entry.rows = rows; entry.hdr = hdr;
    const n = rows.slice(hdr.idx + 1).filter(r => r && r.some(c => c != null && c !== "")).length;
    entry.note = `${hdr.kind === "tx" ? "Transaction report" : "Usage report"}, ${n.toLocaleString()} rows`;
  } catch (e) {
    entry.kind = "bad"; entry.note = "Couldn’t read this file";
  }
}

/* ============================================================
   Parsing (mirrors the wordly-platform-metrics join rules)
   ============================================================ */
// Keep the FIRST column for a repeated header (real Usage reports have two "Time" columns; the second is blank)
function colIndex(headers) { const m = {}; headers.forEach((h, i) => { if (h != null && m[norm(h)] == null) m[norm(h)] = i; }); return m; }

function parseTransactions(entry) {
  const { idx, headers } = entry.hdr; const c = colIndex(headers);
  const get = (r, k) => (c[k] != null ? r[c[k]] : null);
  const out = [];
  for (const r of entry.rows.slice(idx + 1)) {
    if (!r || get(r, "date") == null) continue;
    const date = parseDate(get(r, "date"));
    if (!date) continue;
    const desc = String(get(r, "description") ?? "");
    const sm = desc.match(/Session\s+([A-Za-z0-9-]+)/i);
    out.push({
      date, endSec: parseTime(get(r, "time")),
      accountName: get(r, "account name"), ownerEmail: get(r, "owner email"), ownerName: get(r, "owner name"),
      user: get(r, "user"), dc: norm(get(r, "debit/credit")), description: desc || "",
      sessionId: sm ? sm[1].toUpperCase() : null,
      minutes: num(get(r, "minutes")),
      balance: get(r, "balance") == null || get(r, "balance") === "" ? null : num(get(r, "balance")),
      label: get(r, "label")
    });
  }
  return out;
}

function findCol(c, names) {
  for (const n of names) if (c[n] != null) return c[n];
  const keys = Object.keys(c).filter(k => k !== "timezone");
  for (const n of names) { const k = keys.find(k => k.includes(n)); if (k) return c[k]; }
  return null;
}
function parseUsage(entry) {
  const { idx, headers } = entry.hdr; const c = colIndex(headers);
  const cols = {
    "session id": findCol(c, ["session id", "session"]),
    "title": findCol(c, ["title", "session title"]),
    "date": findCol(c, ["date", "start date"]),
    "time": findCol(c, ["time", "start time"]),
    "real duration": findCol(c, ["real duration", "duration"]),
    "minutes billed": findCol(c, ["minutes billed", "billed minutes", "billed"]),
    "account": findCol(c, ["pool of minutes", "account"]),
    "workspace": findCol(c, ["workspace"]),
    "connection": findCol(c, ["connection"]),
    "label": findCol(c, ["label"]),
    "attendees": findCol(c, ["attendees"]),
    "email": findCol(c, ["email", "email address"]),
    "timezone": findCol(c, ["timezone", "time zone"])
  };
  const get = (r, k) => (cols[k] != null ? r[cols[k]] : null);
  const stats = entry.stats = { rows: 0, noSession: 0, zeroMins: 0, badDate: 0, badTime: 0, samples: [] };
  const dataRows = entry.rows.slice(idx + 1);
  const usedCols = new Set(Object.values(cols).filter(v => v != null));
  const isNumericCol = i => dataRows.every(r => { const v = r?.[i]; return v == null || v === "" || typeof v === "number" || /^\s*\d+(\.\d+)?\s*$/.test(String(v)); });
  // Language columns: anything not a known field, holding only attendee counts
  const langCols = headers.map((h, i) => [h, i]).filter(([h, i]) => h != null && String(h).trim() && !USAGE_SKIP.has(norm(h)) && !usedCols.has(i) && isNumericCol(i));
  const out = [], timeline = entry.timeline = [];
  for (const r of entry.rows.slice(idx + 1)) {
    if (!r || !r.some(v => v != null && v !== "")) continue;
    stats.rows++;
    if (stats.samples.length < 2) stats.samples.push(r);
    if (get(r, "session id") == null || get(r, "session id") === "") { stats.noSession++; continue; }
    const date = parseDate(get(r, "date"));
    let startSec = parseTime(get(r, "time"));
    if (startSec == null) startSec = parseTime(get(r, "date"));
    const durSecs = parseDuration(get(r, "real duration"));
    const mins = num(get(r, "minutes billed"));
    // The timeline uses real duration, so it keeps sessions with zero billed minutes
    if (date && startSec != null && durSecs > 0) timeline.push({
      sessionId: String(get(r, "session id")).trim().toUpperCase(),
      title: get(r, "title") ? String(get(r, "title")).trim() : "Untitled",
      date, startSec, durSecs, mins: cols["minutes billed"] != null ? mins : null,
      tz: get(r, "timezone") != null ? String(get(r, "timezone")).trim() : "",
      workspace: get(r, "workspace") != null ? String(get(r, "workspace")).trim() : ""
    });
    if (!mins) { stats.zeroMins++; continue; } // drop zero-minute rows
    if (!date) { stats.badDate++; continue; }
    if (startSec == null) { stats.badTime++; continue; }
    const startMin = Math.floor(startSec / 60);
    const endAbsMin = dayNum(date) * 1440 + startMin + Math.floor(durSecs / 60);
    const languages = {};
    for (const [h, i] of langCols) { const v = num(r[i]); if (v > 0) languages[String(h).trim()] = Math.round(v); }
    out.push({
      sessionId: String(get(r, "session id")).trim().toUpperCase(),
      title: get(r, "title") ? String(get(r, "title")).trim() : "Untitled",
      date, startSec, endAbsMin,
      durationStr: get(r, "real duration"), durSecs, mins,
      account: get(r, "account") ? String(get(r, "account")).trim() : "Unknown",
      label: get(r, "label") || "",
      workspace: get(r, "workspace") != null ? String(get(r, "workspace")).trim() : "",
      connection: get(r, "connection") != null ? String(get(r, "connection")).trim() : "",
      tz: get(r, "timezone") != null ? String(get(r, "timezone")).trim() : "",
      email: get(r, "email") != null ? String(get(r, "email")).trim().toLowerCase() : "",
      attendees: Math.round(num(get(r, "attendees"))),
      languages
    });
  }
  return out;
}

function joinReports(tx, usage) {
  const bySession = {};
  tx.filter(t => t.dc === "debit" && t.sessionId && t.endSec != null).forEach(t => {
    t.endAbsMin = dayNum(t.date) * 1440 + Math.floor(t.endSec / 60);
    (bySession[t.sessionId] ||= []).push(t);
  });
  const used = new Set(), joined = [], unmatched = [];
  for (const u of usage) {
    const cands = (bySession[u.sessionId] || []).filter(t => !used.has(t));
    let match = cands.find(t => t.endAbsMin === u.endAbsMin) || cands.find(t => Math.abs(t.endAbsMin - u.endAbsMin) <= 1);
    if (!match) { unmatched.push(u); continue; }
    used.add(match);
    joined.push({
      ...u,
      accountName: match.accountName, ownerEmail: match.ownerEmail, balanceAfter: match.balance,
      ts: dayNum(u.date) * 86400 + u.startSec,
      languagesStr: Object.entries(u.languages).map(([k, v]) => `${k}: ${v}`).join(", ")
    });
  }
  return { joined, unmatched };
}

function usageOnly(usage) {
  return usage.map(u => ({
    ...u, accountName: null, ownerEmail: null, balanceAfter: null,
    ts: dayNum(u.date) * 86400 + u.startSec,
    languagesStr: Object.entries(u.languages).map(([k, v]) => `${k}: ${v}`).join(", ")
  }));
}

function buildData(tx, usage, timelineRaw = []) {
  const hasTx = Boolean(tx);
  tx = tx || [];
  const { joined, unmatched } = hasTx ? joinReports(tx, usage) : { joined: usageOnly(usage), unmatched: [] };
  joined.forEach(r => { r.uid = `${r.sessionId}|${r.date}|${r.startSec}`; });
  const balances = {};
  [...tx].filter(t => t.balance != null && t.accountName)
    .sort((a, b) => (dayNum(a.date) * 86400 + (a.endSec || 0)) - (dayNum(b.date) * 86400 + (b.endSec || 0)))
    .forEach(t => { balances[t.accountName] = { balance: t.balance, email: t.ownerEmail }; });

  // Customer name: most common owner email domain
  const domains = {};
  tx.forEach(t => { const d = String(t.ownerEmail || "").split("@")[1]; if (d) domains[d] = (domains[d] || 0) + 1; });
  const topDomain = Object.entries(domains).sort((a, b) => b[1] - a[1])[0]?.[0];
  const customer = topDomain ? topDomain.split(".").slice(-2, -1)[0].replace(/^./, c => c.toUpperCase()) : "";

  const timeline = buildTimeline(timelineRaw);
  const dates = (joined.length ? joined.map(r => r.date) : timeline.items.map(x => dayToStr(Math.floor(x.start / 86400)))).sort();
  return {
    joined, unmatched, balances, customer, hasTx,
    transactions: tx.map(t => ({ date: t.date, endSec: t.endSec, accountName: t.accountName, ownerEmail: t.ownerEmail, ownerName: t.ownerName, user: t.user, dc: t.dc, minutes: t.minutes, balance: t.balance, description: t.description })),
    hasWorkspace: joined.some(r => r.workspace), hasConnection: joined.some(r => r.connection),
    totalUsage: usage.length, txDebits: tx.filter(t => t.dc === "debit").length,
    timeline,
    range: dates.length ? [dates[0], dates[dates.length - 1]] : null
  };
}

function activeRows() {
  let rows = state.data.joined;
  if (state.excluded?.size) rows = rows.filter(r => !state.excluded.has(r.uid));
  if (state.workspace) rows = rows.filter(r => r.workspace === state.workspace);
  const g = currentGroup();
  if (g) { const set = new Set(g.titles); rows = rows.filter(x => set.has(x.title)); }
  const r = state.range;
  if (r.fromDate || r.toDate) {
    const from = r.fromDate ? dayNum(r.fromDate) * 86400 + (r.fromTime ? parseTime(r.fromTime) : 0) : -Infinity;
    const to = r.toDate ? dayNum(r.toDate) * 86400 + (r.toTime ? parseTime(r.toTime) + 59 : 86399) : Infinity;
    rows = rows.filter(x => x.ts <= to && x.ts + x.durSecs >= from);
  }
  return rows;
}

/* ============================================================
   Aggregations
   ============================================================ */
function sumBy(rows, keyFn, valFn) { const m = {}; rows.forEach(r => { const k = keyFn(r); m[k] = (m[k] || 0) + valFn(r); }); return m; }
function monthsBetween(a, b) {
  const out = []; let [y, m] = a.split("-").map(Number); const [ey, em] = b.split("-").map(Number);
  while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function langTotals(rows) { const m = {}; rows.forEach(r => Object.entries(r.languages).forEach(([l, v]) => m[l] = (m[l] || 0) + v)); return m; }
function eventsByTitle(rows) {
  const m = {};
  rows.forEach(r => {
    const e = (m[r.title] ||= { title: r.title, minutes: 0, attendees: 0, instances: 0, languages: {} });
    e.minutes += r.mins; e.attendees += r.attendees; e.instances++;
    Object.entries(r.languages).forEach(([l, v]) => e.languages[l] = (e.languages[l] || 0) + v);
  });
  return Object.values(m);
}

  if (txCount > 1) hint = "Only one Transaction report can be used. Remove the extras.";
  else if (hasTx && !hasUsage) hint = "Now add the Usage report(s).";
  else if (!hasTx && hasUsage) hint = "Ready to build. Add the Admin Transaction report too if you want remaining balances.";
  else if (hasTx && hasUsage) hint = "Ready to build.";
  const badCount = state.files.filter(f => f.kind === "bad").length;
  if (badCount) hint += ` ${badCount === 1 ? "1 file isn’t" : badCount + " files aren’t"} a recognized report and will be ignored.`;
  const ready = txCount <= 1 && hasUsage;

  $("#app").innerHTML = `
    <div class="start">

      ${state.apiMode ? customerSearchHtml() : `<h1>Create a usage dashboard</h1>

      <datalist id="upCustomers"></datalist>`}
      <div class="drop" id="drop">

      </div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}

      ${state.files.length ? `<ul class="file-list">${state.files.map(f => `
        <li>
          <span class="name" title="${esc(f.file.name)}">${esc(f.file.name)}</span>
          <span class="tag ${f.kind === "tx" ? "tx" : f.kind === "usage" ? "usage" : "bad"}">${esc(f.note || "Reading…")}</span>

async function addFiles(list) {
  const entries = [...list].map(file => ({ id: ++fileSeq, file, kind: null, note: null }));
  state.files.push(...entries); renderUpload();
  await Promise.all(entries.map(detectFile)); renderUpload();
}

function usageDiag() {
  return state.files.filter(f => f.kind === "usage").map(f => {
    const s = f.stats || {};
    const sample = (s.samples || [])[0] || [];
    const pairs = f.hdr.headers.slice(0, 16).map((h, i) => [h, sample[i]]).filter(([h]) => h != null);
    return `<details class="diag" open><summary>${esc(f.file.name)}</summary>
      <p>${fmtN(s.rows)} rows read. Skipped: ${fmtN(s.noSession)} with no session ID, ${fmtN(s.zeroMins)} with zero billed minutes, ${fmtN(s.badDate)} with an unreadable date, ${fmtN(s.badTime)} with an unreadable start time.</p>
      ${pairs.length ? `<p>Columns and the first row of data:</p><table class="stats-table"><tbody>${pairs.map(([h, v]) => `<tr><td>${esc(h)}</td><td>${esc(v == null || v === "" ? "(blank)" : String(v).slice(0, 60))}</td></tr>`).join("")}</tbody></table>` : ""}
    </details>`;
  }).join("");
}

function build() {
  try {
    const txEntry = state.files.find(f => f.kind === "tx");
    const tx = txEntry ? parseTransactions(txEntry) : null;
    const { rows: usage, dupes } = dedupeUsage(state.files.filter(f => f.kind === "usage").flatMap(parseUsage));
    const timelineRaw = state.files.filter(f => f.kind === "usage").flatMap(f => f.timeline || []);
    const data = buildData(tx, usage, timelineRaw);
    data.usageFiles = state.files.filter(f => f.kind === "usage").length;
    data.dupesRemoved = dupes;
    if (!state.pendingCustomer && state.uploadCustomer && state.uploadCustomer.trim()) data.customer = state.uploadCustomer.trim();
    state.version = null; state.agenda = null;
    if (state.pendingCustomer) { data.customer = state.pendingCustomer; data.source = "bigquery"; data.accountSnapshot = state.pendingAccounts && state.pendingAccounts.length ? state.pendingAccounts : null; }
    state.pendingAccounts = null; state.snap = null;
    state.pendingCustomer = null;
    if (!usage.length && !timelineRaw.length) {
      renderUpload("No sessions could be read from the Usage reports. The details below show what was found in each file.", usageDiag());
      return;
    }
    if (usage.length && !data.joined.length) {
      renderUpload(`None of the ${usage.length} usage rows matched the Transaction report. Check that these reports are for the same organization and date range.`);
      return;
    }
    state.baseData = data; state.tz = data.source === "bigquery" ? browserZone() : ""; applyTz(); state.groups = loadGroups(); state.eventGroup = ""; state.excluded = loadExcluded(); state.picked = new Set(); state.tab = data.joined.length ? "overview" : "timeline"; state.tlDay = null; state.selectedEvent = null; state.workspace = ""; state.range = { fromDate: "", fromTime: "", toDate: "", toTime: "" };
    state.table = { sortKey: "ts", dir: -1, page: 0, q: "", account: "", session: "", from: "", to: "" };
    renderDashboard();
  } catch (e) {
    console.error(e); renderUpload("Something in these files couldn’t be processed: " + e.message);
  }
}

function chosenCharts(d) {

    },

    </div>`;
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    const k = b.dataset.sort;
    if (t.sortKey === k) t.dir *= -1; else { t.sortKey = k; t.dir = ["ts", "mins", "attendees", "durSecs", "balanceAfter"].includes(k) ? -1 : 1; }

  });
  $("#prev").onclick = () => { t.page--; drawTable(); };
  $("#next").onclick = () => { t.page++; drawTable(); };
  if (!edit) return;
  document.querySelectorAll("[data-remove-uid]").forEach(b => b.onclick = () => { picked.delete(b.dataset.removeUid); removeSessions([b.dataset.removeUid]); });
  document.querySelectorAll(".pick-row").forEach(cb => cb.onchange = () => { cb.checked ? picked.add(cb.dataset.uid) : picked.delete(cb.dataset.uid); drawTable(); });
  const pa = $("#pickAll"); if (pa) pa.onchange = () => { slice.forEach(r => pa.checked ? picked.add(r.uid) : picked.delete(r.uid)); drawTable(); };
  const rp = $("#removePicked"); if (rp) rp.onclick = () => removeSessions([...picked]);
  const cp = $("#clearPicked"); if (cp) cp.onclick = () => { picked.clear(); drawTable(); };
}

/* ============================================================
   Event timeline
   ============================================================ */
const TZ_OFFSETS = { UTC: 0, GMT: 0, EDT: -4, EST: -5, CDT: -5, CST: -6, MDT: -6, MST: -7, PDT: -7, PST: -8, AKDT: -8, AKST: -9, HST: -10, BST: 1, CET: 1, CEST: 2, EET: 2, EEST: 3, JST: 9, SGT: 8, AEST: 10, AEDT: 11 };
// Puts every usage row in the most common time zone, then drops copies of the same session

// when it was scraped in different time zones, e.g. 8:45 PM EDT and 5:45 PM PDT.
function dedupeUsage(rows) {
  const counts = {};
  rows.forEach(u => { counts[u.tz] = (counts[u.tz] || 0) + 1; });
  const zone = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
  const zOff = TZ_OFFSETS[String(zone).toUpperCase()];
  const seen = new Set(), out = [];
  for (const u of rows) {
    let loc = dayNum(u.date) * 86400 + u.startSec;
    const o = TZ_OFFSETS[String(u.tz || "").toUpperCase()];
    if (u.tz !== zone && o != null && zOff != null) {
      loc += (zOff - o) * 3600;
      const dn = Math.floor(loc / 86400);
      u.date = dayToStr(dn); u.startSec = loc - dn * 86400; u.tz = zone;
      u.endAbsMin = Math.floor(loc / 60) + Math.floor(u.durSecs / 60);
    }
    const k = `${u.sessionId}|${Math.floor(loc / 60)}|${u.durSecs}`;
    if (seen.has(k)) continue;
    seen.add(k); out.push(u);
  }
  return { rows: out, dupes: rows.length - out.length };
}
function buildTimeline(raw) {
  const counts = {};
  raw.forEach(x => { counts[x.tz] = (counts[x.tz] || 0) + 1; });
  const zone = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
  const zOff = TZ_OFFSETS[zone.toUpperCase()];
  const seen = new Set(), items = [];
  let unconverted = 0;
  for (const x of raw) {
    let shift = 0;
    if (x.tz !== zone) {
      const o = TZ_OFFSETS[String(x.tz).toUpperCase()];
      if (o != null && zOff != null) shift = (zOff - o) * 3600; else unconverted++;
    }
    const start = dayNum(x.date) * 86400 + x.startSec + shift;
    // Same session at the same real moment = one session, even if stored in two time zones
    const k = `${x.sessionId}|${Math.floor(start / 60)}|${x.durSecs}`;
    if (seen.has(k)) continue;
    seen.add(k);
    items.push({ ...x, uid: `${x.sessionId}|${x.date}|${x.startSec}`, start, end: start + x.durSecs });
  }

}
function fmtDurLong(sec) {

  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return [h ? `${h} hr` : "", m ? `${m} min` : "", s || (!h && !m) ? `${s} sec` : ""].filter(Boolean).join(" ");
}
function fmtHour(h) { h = h % 24; return h === 0 ? "12 AM" : h === 12 ? "12 PM" : h < 12 ? `${h} AM` : `${h - 12} PM`; }

  const iv = xs.map(x => [Math.max(x.start, d0), Math.min(x.end, d1)]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [a, b] of iv) { const last = out[out.length - 1]; if (last && a <= last[1]) last[1] = Math.max(last[1], b); else out.push([a, b]); }

}
function timelineItems() {
  let items = state.data.timeline?.items || [];
  if (state.excluded?.size) items = items.filter(x => !state.excluded.has(x.uid));
  if (state.workspace) items = items.filter(x => x.workspace === state.workspace);
  const g = currentGroup();
  if (g) { const set = new Set(g.titles); items = items.filter(x => set.has(x.title)); }

  let list = Object.keys(days).map(Number).sort((a, b) => a - b);

/* ============================================================
   Agenda comparison: when Wordly was scheduled vs. when it ran
   ============================================================ */
const AGENDA_ANY = "*";
function utcToDisplay(utc) {

}

}

      if (bs > s) out.push([s, Math.min(bs, e0)]);
      s = Math.max(s, be);

}

  for (const [s, e] of sorted) { const l = out[out.length - 1]; if (l && s <= l[1]) l[1] = Math.max(l[1], e); else out.push([s, e]); }
  return out;
}

  const items = ag.items.map(it => ({ ...it, start: utcToDisplay(localToUtc(it.startLocal, ag.zone)), end: utcToDisplay(localToUtc(it.endLocal, ag.zone)) }));

async function importAgenda(file) {

    const rows = await readSheet(file);

      const h = (rows[i] || []).map(norm);
      const find = (exact, contains) => {
        for (const k of exact) { const j = h.indexOf(k); if (j >= 0) return j; }
        for (const k of contains) { const j = h.findIndex(x => x && x.includes(k)); if (j >= 0) return j; }
        return -1;
      };
      const start = find(["start", "start time", "starts", "begin", "from", "time"], ["start", "begin"]);
      if (start < 0) continue;
      let end = find(["end", "end time", "ends", "finish", "until", "to"], ["end time", "finish"]);
      if (end === start) end = -1;
      cols = {
        start, end,
        date: find(["date", "day"], ["date"]),
        dur: find([], ["duration", "length (min", "minutes"]),
        title: find(["session", "title", "name", "topic", "event", "session name", "session title"], ["session", "title", "topic"]),
        room: find(["room", "location", "track", "stage", "venue", "hall"], ["room", "location", "track", "stage", "venue", "hall"])
      };
      hi = i; break;
    }
    if (hi < 0) throw new Error("no start time column was found. Use the template for the expected columns.");
    const items = [];
    for (const r of rows.slice(hi + 1)) {
      if (!r) continue;
      const sv = r[cols.start];
      if (sv == null || sv === "") continue;
      const date = parseDate(cols.date >= 0 && r[cols.date] != null && r[cols.date] !== "" ? r[cols.date] : sv);
      const st = parseTime(sv);
      if (!date || st == null) continue;
      let en = cols.end >= 0 ? parseTime(r[cols.end]) : null;
      let endLocal = null;
      const startLocal = dayNum(date) * 86400 + st;
      if (en != null) { endLocal = dayNum(date) * 86400 + en; if (endLocal <= startLocal) endLocal += 86400; }
      else if (cols.dur >= 0 && r[cols.dur] != null) {
        const v = r[cols.dur]; const secs = typeof v === "number" ? v * 60 : (parseDuration(v) || num(v) * 60);
        if (secs > 0) endLocal = startLocal + secs;
      }
      if (endLocal == null) continue;
      const title = cols.title >= 0 && r[cols.title] != null ? String(r[cols.title]).trim() : "";
      const room = cols.room >= 0 && r[cols.room] != null ? String(r[cols.room]).trim() : "";
      items.push({ title: title || "Scheduled session", room, key: room || "Agenda", startLocal, endLocal });
    }

    const keys = [...new Set(items.map(i => i.key))];

    toast(`Agenda added: ${items.length} scheduled ${items.length === 1 ? "session" : "sessions"}.`);

/* ============================================================
   Time zone conversion
   ============================================================ */
const TZ_CHOICES = [
  ["America/New_York", "Eastern (US)"], ["America/Chicago", "Central (US)"], ["America/Denver", "Mountain (US)"],
  ["America/Phoenix", "Arizona"], ["America/Los_Angeles", "Pacific (US)"], ["America/Anchorage", "Alaska"],
  ["Pacific/Honolulu", "Hawaii"], ["America/Sao_Paulo", "Brasília"], ["UTC", "UTC"], ["Europe/London", "London"],
  ["Europe/Paris", "Central Europe"], ["Europe/Athens", "Eastern Europe"], ["Africa/Johannesburg", "South Africa"],
  ["Asia/Dubai", "Dubai"], ["Asia/Kolkata", "India"], ["Asia/Singapore", "Singapore"], ["Asia/Shanghai", "China"],

  catch { return zone; }
}

}
// Builds the view of the data in the chosen time zone. The uploaded data stays untouched in state.baseData.
function convertData(base, target) {

  return {
    ...base, joined, unmatched, zoneLabel: label, tzConvertible: true,

  return `<option value="">As reported (${esc(sourceZone(state.baseData) || "report time")})</option>` +
    list.map(([z, l]) => `<option value="${z}" ${state.tz === z ? "selected" : ""}>${esc(l)} (${esc(zoneAbbr(z, ref))})${z === mine ? ", yours" : ""}</option>`).join("");

    t.runs++; t.mins += mins || 0;
    if (date < t.first) t.first = date;
    if (date > t.last) t.last = date;

    const parts = t.title.split(/\s+[-–—|:]\s+|:\s+/);

    const a = (m[t.accountName || "Unknown"] ||= { name: t.accountName || "Unknown", email: "", owner: "", credited: 0, consumed: 0, other: 0, balance: null, last: null, count: 0 });
    if (t.ownerEmail) a.email = t.ownerEmail;
    if (t.ownerName) a.owner = t.ownerName;
    if (to && t.date > to) continue;
    if (t.balance != null) a.balance = t.balance;
    if (from && t.date < from) continue;
    a.count++; a.last = t.date;
    if (t.dc === "credit") a.credited += Math.abs(t.minutes);

async function loadCustomer() {

  [["service", "services"], ["company", "companies"], ["domain", "domains"], ["account", "accounts"], ["pool", "pools"]].forEach(([k, plural]) => { body[plural] = cs.selected.filter(r => r.kind === k).map(r => r.value); });

    if (cs.save) {

    state.files = state.files.filter(f => f.kind === "tx").concat(entry);

  $("#snapPrev").onclick = () => { st.page--; drawSnapTable(); };
  $("#snapNext").onclick = () => { st.page++; drawSnapTable(); };
}

/* ============================================================
   Saved dashboards: time-stamped versions kept in this browser
   ============================================================ */
const vault = {
  _db: null,
  async db() {
    if (this._db) return this._db;
    this._db = await new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("this browser doesn’t allow saving"));
      let r;
      try { r = indexedDB.open("wordly-dashboards", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("meta", { keyPath: "id" }); d.createObjectStore("data", { keyPath: "id" }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error("storage is unavailable"));
    });
    return this._db;
  },
  async list() {
    const d = await this.db();
    return new Promise((res, rej) => {
      const r = d.transaction("meta").objectStore("meta").getAll();
      r.onsuccess = () => res(r.result.sort((a, b) => b.savedAt.localeCompare(a.savedAt)));
      r.onerror = () => rej(r.error);
    });
  },
  async get(id) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const r = d.transaction("data").objectStore("data").get(id);
      r.onsuccess = () => res(r.result ? r.result.data : null);
      r.onerror = () => rej(r.error);
    });
  },
  async put(meta, data) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const t = d.transaction(["meta", "data"], "readwrite");
      t.objectStore("meta").put(meta); t.objectStore("data").put({ id: meta.id, data });
      t.oncomplete = () => res(meta);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error("there isn’t enough storage space"));
    });
  },
  async remove(id) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const t = d.transaction(["meta", "data"], "readwrite");
      t.objectStore("meta").delete(id); t.objectStore("data").delete(id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  }
};
function fmtStamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const h = d.getHours(), m = d.getMinutes();
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} at ${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? "AM" : "PM"}`;
}
function stampForFile(iso) { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}${pad(d.getMinutes())}`; }
async function saveTextFile(filename, text, type) {
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (dl) {
    try { await dl.save({ filename, data: text }); return true; }
    catch (e) { if (e?.code !== "declined") toast("Couldn’t save the file here."); return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
function versionMeta(data, id, savedAt) {
  return {
    id, savedAt, customer: data.customer || "Untitled customer",
    sessions: data.joined.length, minutes: data.joined.reduce((a, r) => a + r.mins, 0),
    range: data.range || null, balances: Boolean(data.hasTx || (data.accountSnapshot && data.accountSnapshot.length))
  };
}
function openSaveDialog() {
  let dlg = $("#saveDlg");
  if (!dlg) { dlg = document.createElement("dialog"); dlg.id = "saveDlg"; document.body.appendChild(dlg); }
  dlg.innerHTML = `
    <div class="dlg-head"><h2>Save this version</h2><button class="remove" id="svClose" aria-label="Close">×</button></div>
    <p class="hint">Saved versions are kept in this browser on this computer, with the date and time you save them. Save a new version whenever you load newer reports.</p>
    <label class="field">Customer name<input type="text" id="svName" list="svCustomers" value="${esc(state.data.customer || "")}" placeholder="For example, Cohesity"></label>
    <datalist id="svCustomers"></datalist>
    <div class="upload-actions"><button class="btn primary" id="svGo">Save version</button><span class="hint" id="svMsg"></span></div>`;
  vault.list().then(list => { $("#svCustomers").innerHTML = [...new Set(list.map(m => m.customer))].map(c => `<option value="${esc(c)}">`).join(""); }).catch(() => {});
  $("#svClose").onclick = () => dlg.close();
  $("#svGo").onclick = async () => {
    const name = $("#svName").value.trim();
    if (!name) { $("#svMsg").textContent = "Add the customer’s name."; $("#svName").focus(); return; }
    $("#svGo").disabled = true; $("#svMsg").textContent = "Saving…";
    state.baseData.customer = name; state.data.customer = name;
    const data = snapshot(), savedAt = new Date().toISOString();
    const meta = versionMeta(data, "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), savedAt);
    try {
      await vault.put(meta, data);
      state.version = meta; dlg.close();
      toast(`Saved ${name}, ${fmtStamp(savedAt)}`);
      renderDashboard();
    } catch (e) {
      $("#svGo").disabled = false;
      $("#svMsg").textContent = `Couldn’t save in this browser (${e.message}). Use “Download backup” on the start screen instead.`;
    }
  };
  dlg.showModal();
}
function loadDataset(data, version) {
  Object.assign(state, {
    baseData: data, readOnly: false, sharedInfo: "", version: version || null,
    tab: data.joined.length ? "overview" : "timeline", tlDay: null, workspace: "", selectedEvent: null, eventGroup: "",
    range: { fromDate: "", fromTime: "", toDate: "", toTime: "" },
    table: { sortKey: "ts", dir: -1, page: 0, q: "", account: "", session: "", from: "", to: "" },
    picked: new Set(), snap: null, tz: "", agenda: data.agenda || null
  });
  applyTz();
  state.groups = data.groups && data.groups.length ? data.groups : loadGroups();
  state.excluded = loadExcluded();
  renderDashboard();
}
async function openVersion(id) {
  try {
    const [data, list] = await Promise.all([vault.get(id), vault.list()]);
    if (!data) { toast("That version couldn’t be found."); return; }
    loadDataset(data, list.find(m => m.id === id));
  } catch (e) { toast("Couldn’t open that version: " + e.message); }
}
async function downloadBackup(id) {
  const [data, list] = await Promise.all([vault.get(id), vault.list()]);
  const meta = list.find(m => m.id === id);
  if (!data || !meta) return;
  const ok = await saveTextFile(`${meta.customer} - Wordly dashboard - ${stampForFile(meta.savedAt)}.json`,
    JSON.stringify({ format: "wordly-dashboard", formatVersion: 1, meta, data }), "application/json");
  if (ok) toast("Backup file downloaded.");
}
async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.format !== "wordly-dashboard" || !j.data || !Array.isArray(j.data.joined)) throw new Error("this isn’t a Wordly dashboard backup file");
    const meta = { ...versionMeta(j.data, j.meta?.id || "v" + Date.now().toString(36), j.meta?.savedAt || new Date().toISOString()), customer: j.meta?.customer || j.data.customer || "Untitled customer" };
    try { await vault.put(meta, j.data); } catch { /* storage unavailable: open it without saving */ }
    toast(`Opened ${meta.customer}, saved ${fmtStamp(meta.savedAt)}`);
    loadDataset(j.data, meta);
  } catch (e) { toast("Couldn’t open that file: " + e.message); }
}
async function renderLibrary() {
  const box = $("#library");
  if (!box) return;
  const importHtml = `<div class="lib-foot"><button class="btn" id="importBtn">Open a backup file</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>`;
  const wireImport = () => {
    $("#importBtn").onclick = () => $("#importFile").click();
    $("#importFile").onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); };
  };
  let list;
  try { list = await vault.list(); }
  catch (e) {
    box.innerHTML = `<h2 class="lib-h">Saved dashboards</h2><p class="hint">Saving isn’t available in this browser (${esc(e.message)}). You can still build dashboards, and open backup files.</p>${importHtml}`;
    wireImport(); return;
  }
  const dl = $("#upCustomers");
  if (dl) dl.innerHTML = [...new Set(list.map(m => m.customer))].map(c => `<option value="${esc(c)}">`).join("");
  const groups = {};
  list.forEach(m => { (groups[m.customer.toLowerCase()] ||= { name: m.customer, items: [] }).items.push(m); });
  const custs = Object.values(groups);
  box.innerHTML = `<h2 class="lib-h">Saved dashboards</h2>
    ${custs.length ? custs.map(g => `<div class="lib-cust">
      <div class="lib-name"><span>${esc(g.name)}</span><button class="link-btn" data-newver="${esc(g.name)}">Add new version</button></div>
      <ul class="lib-list">${g.items.map(m => `<li>
        <button class="lib-open" data-open="${m.id}">${esc(fmtStamp(m.savedAt))}</button>
        <span class="lib-meta">${fmtN(m.sessions)} sessions${m.range ? `, ${esc(prettyDate(m.range[0]))} to ${esc(prettyDate(m.range[1]))}` : ""}</span>
        <span class="lib-actions"><button class="link-btn" data-backup="${m.id}">Download backup</button><button class="link-btn danger" data-del="${m.id}">Delete</button></span>
      </li>`).join("")}</ul></div>`).join("") : `<p class="hint">Dashboards you save show up here, grouped by customer, with the date and time of each version.</p>`}
    ${importHtml}`;
  wireImport();
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openVersion(b.dataset.open));
  box.querySelectorAll("[data-backup]").forEach(b => b.onclick = () => downloadBackup(b.dataset.backup));
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = "Click again to delete"; return; }
    await vault.remove(b.dataset.del); renderLibrary();
  });
  box.querySelectorAll("[data-newver]").forEach(b => b.onclick = () => {
    state.uploadCustomer = b.dataset.newver;
    const inp = $("#upCustomer"); if (inp) { inp.value = state.uploadCustomer; inp.focus(); }
    toast(`Add ${state.uploadCustomer}’s new reports, then build and save.`);
  });
}
async function fillVersionPicker() {
  const sel = $("#verSel"), wrap = $("#verWrap");
  if (!sel || state.readOnly) return;
  try {
    const list = await vault.list();
    if (!list.length) return;

/* ============================================================
   Sharing (encrypted link) and file export
   ============================================================ */
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toUrl = s => s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const fromUrl = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return s; };
async function streamBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
const CHUNK = 200000;

function snapshot() {
  const { joined, unmatched, balances, customer, hasTx, hasWorkspace, hasConnection, totalUsage, range, timeline, transactions, accountSnapshot } = state.baseData;
  const ex = state.excluded || new Set();
  return {
    joined: joined.filter(r => !ex.has(r.uid)), unmatched, balances, customer, hasTx, hasWorkspace, hasConnection, totalUsage, range,
    timeline: timeline ? { ...timeline, items: timeline.items.filter(x => !ex.has(x.uid)) } : timeline,
    transactions, accountSnapshot, groups: state.groups, agenda: state.agenda || null
  };
}

// The key lives only in the link (after #), never in the database, so the
// stored copy is unreadable without the exact link.
async function createShare(title) {
  const db = state.db;
  let bytes = new TextEncoder().encode(JSON.stringify(snapshot()));
  const gz = typeof CompressionStream !== "undefined";
  if (gz) bytes = await streamBytes(bytes, new CompressionStream("gzip"));
  const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = b64(new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes)));
  const keyStr = toUrl(b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))));
  const id = toUrl(b64(crypto.getRandomValues(new Uint8Array(12))));
  const parts = Math.ceil(ct.length / CHUNK);
  for (let i = 0; i < parts; i++) await db.doc(`shared/${id}/parts/${i}`).set({ d: ct.slice(i * CHUNK, (i + 1) * CHUNK) });
  await db.doc(`shared/${id}`).set({ v: 1, title, createdAt: new Date().toISOString(), parts, iv: b64(iv), gz, sessions: state.data.joined.length });
  return `${SHARE_BASE}#${id}.${keyStr}`;
}

async function loadShare(token) {
  const [id, keyStr] = token.split(".");
  const db = state.db;
  const meta = await db.doc(`shared/${id}`).get();
  if (!meta.exists) throw new Error("not_found");
  const m = meta.data();
  const parts = await Promise.all(Array.from({ length: m.parts }, (_, i) => db.doc(`shared/${id}/parts/${i}`).get()));
  if (parts.some(p => !p.exists)) throw new Error("incomplete");
  const ct = parts.map(p => p.data().d).join("");
  const key = await crypto.subtle.importKey("raw", unb64(fromUrl(keyStr)), "AES-GCM", false, ["decrypt"]);
  let bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(m.iv) }, key, unb64(ct)));
  if (m.gz) bytes = await streamBytes(bytes, new DecompressionStream("gzip"));
  return { data: JSON.parse(new TextDecoder().decode(bytes)), meta: m };
}

function toast(msg) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3500);
}

function openShare() {
  let dlg = $("#shareDlg");
  if (!dlg) { dlg = document.createElement("dialog"); dlg.id = "shareDlg"; document.body.appendChild(dlg); }
  dlg.innerHTML = `
    <div class="dlg-head"><h2>Share this dashboard</h2><button class="remove" id="shareClose" aria-label="Close">×</button></div>
    <p class="hint">Creates a link to an interactive copy of this dashboard, with all its charts and filters. Anyone with access to this page in Claude can open the link. The data is encrypted, so only people with this exact link can read it.</p>
    <label class="field">Name shown on the shared dashboard<input type="text" id="shareTitle" value="${esc(state.data.customer || "")}"></label>
    <div class="upload-actions"><button class="btn primary" id="shareGo">Create link</button><span class="hint" id="shareStatus"></span></div>
    <div id="shareOut"></div>`;
  $("#shareClose").onclick = () => dlg.close();
  $("#shareGo").onclick = async () => {
    const go = $("#shareGo"), status = $("#shareStatus");
    go.disabled = true; status.textContent = "Creating link…";
    try {
      const link = await createShare($("#shareTitle").value.trim() || state.data.customer || "Wordly usage");
      status.textContent = "Link created.";
      $("#shareOut").innerHTML = `<div class="share-link"><input type="text" id="shareLink" readonly value="${esc(link)}" aria-label="Share link"><button class="btn primary" id="shareCopy">Copy link</button></div>
        <p class="hint">Each link is a snapshot of the data as it is now. Create a new link after loading newer reports.</p>`;
      $("#shareLink").onclick = e => e.target.select();
      $("#shareCopy").onclick = async () => {
        try { await navigator.clipboard.writeText(link); $("#shareCopy").textContent = "Copied"; }
        catch { $("#shareLink").select(); $("#shareCopy").textContent = "Press Cmd+C or Ctrl+C"; }
      };
    } catch (e) {
      console.error(e); go.disabled = false;
      status.textContent = e?.code === "quota_exceeded" ? "Storage for shared links is full. Ask Claude to add a way to remove old links." : "Couldn’t create the link. Try again in a moment.";
    }
  };
  dlg.showModal();
}

function slugify(s) { return String(s || "wordly").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "wordly"; }
// Libraries: built into the page when this copy has them inline (the customer file), else from the CDN
function libTags() {
  const x = document.getElementById("lib-xlsx"), c = document.getElementById("lib-chart");
  if (x && c && x.textContent.length > 1000) {
    const safe = t => t.replace(/<\/script/gi, "<\\/script");
    return `<script id="lib-xlsx">${safe(x.textContent)}<\/script>\n<script id="lib-chart">${safe(c.textContent)}<\/script>`;
  }
  return `<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>`;
}
function buildExportHtml() {
  const embed = JSON.stringify({ data: snapshot(), exportedAt: new Date().toISOString() }).replace(/</g, "\\u003c");
  const title = `${state.data.customer ? state.data.customer + " " : ""}Wordly usage dashboard`;
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${esc(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
${libTags()}
<style id="app-style">${$("#app-style").textContent}</style>
</head>
<body>
${SHELL_HEADER}
<main id="app"></main>
<script>window.__WORDLY_EMBED__ = ${embed};<\/script>
<script id="app-script">${$("#app-script").textContent}<\/script>
</body>
</html>`;
}
// File name from the report itself: customer (or main account) plus the report's date range
function exportFilename() {
  const d = state.baseData;
  let name = d.customer || "";
  if (!name || slugify(name) === "wordly") {
    const acc = Object.entries(sumBy(d.joined, r => r.accountName || r.account, r => r.mins)).sort((a, b) => b[1] - a[1])[0]?.[0];
    if (acc && acc !== "Unknown") name = acc.replace(/\s*\(\d+\)\s*$/, "");
  }
  const parts = ["wordly-dashboard"];
  if (name) parts.push(slugify(name));
  const r = d.range;
  if (r) parts.push(r[0] === r[1] ? r[0] : `${r[0]}_to_${r[1]}`);
  return parts.join("_") + ".html";
}
async function downloadFile() {
  const html = buildExportHtml();
  const filename = exportFilename();
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (dl) {
    try { await dl.save({ filename, data: html }); toast("Dashboard file saved."); }
    catch (e) { if (e?.code !== "declined") toast("Couldn’t save the file here."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

function enterReadOnly(data, info) {
  Object.assign(state, {
    baseData: data, tz: "", groups: data.groups || [], agenda: data.agenda || null, eventGroup: "", excluded: new Set(), picked: new Set(), readOnly: true, sharedInfo: info, tab: data.joined.length ? "overview" : "timeline", tlDay: null, workspace: "", selectedEvent: null,
    range: { fromDate: "", fromTime: "", toDate: "", toTime: "" },
    table: { sortKey: "ts", dir: -1, page: 0, q: "", account: "", session: "", from: "", to: "" }
  });
  applyTz();
  renderDashboard();
}
function showMessage(msg) { $("#app").innerHTML = `<div class="panel empty" style="margin-top:40px">${esc(msg)}</div>`; }

async function boot() {
  const hasClaude = Boolean(window.claude && window.claude.use);
  if (window.__WORDLY_EMBED__) {
    const e = window.__WORDLY_EMBED__;
    enterReadOnly(e.data, `Exported ${prettyDate(e.exportedAt.slice(0, 10))}`);
    return;
  }
  const token = (location.hash || "").slice(1);
  if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token)) {
    showMessage("Opening shared dashboard…");
    const db = hasClaude ? await window.claude.use("db") : null;
    if (!db) { showMessage("This shared dashboard opens in Claude. Sign in to claude.ai with an account that has access to this page, then open the link again."); return; }
    state.db = db;
    try {
      const { data, meta } = await loadShare(token);
      data.customer = meta.title || data.customer;
      enterReadOnly(data, `Shared ${prettyDate(meta.createdAt.slice(0, 10))}`);
    } catch (e) {
      console.error(e);
      showMessage("This link doesn’t open a dashboard. It may have been copied incompletely. Ask the person who shared it for a new link.");
    }
    return;
  }
  state.apiMode = await detectApi();
  if (state.apiMode) await store.load();
  if (state.apiMode) $("#restart").textContent = "Change customer";
  renderUpload();
  if (hasClaude) window.claude.use("db").then(db => { state.db = db; if (state.data && !state.readOnly) $("#shareBtn").hidden = !db; });
}

/* ============================================================
   Boot
   ============================================================ */
$("#restart").onclick = () => { state.files = []; state.data = null; renderUpload(); };
$("#shareBtn").onclick = openShare;
$("#exportBtn").onclick = downloadFile;
$("#saveBtn").onclick = openSaveDialog;
document.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => {
  state.unit = b.dataset.unit;
  try { localStorage.setItem("wordly-unit", state.unit); } catch {}
  if (state.data) renderDashboard();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.data) renderDashboard(); });
new MutationObserver(() => { if (state.data) renderDashboard(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
boot();
